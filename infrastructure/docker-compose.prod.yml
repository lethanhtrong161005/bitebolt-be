version: "3.9"

services:

  postgres:
    image: postgres:15-alpine
    container_name: BiteBolt-postgres-prod
    env_file:
      - ../.env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rootpassword_secure}
      POSTGRES_DB: user_db
    ports:
      # Khuyến nghị: Không nên expose port DB ra ngoài trên Production, trừ khi cần remote access
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - BiteBolt-network-prod
    restart: always

  redis:
    image: redis:7-alpine
    container_name: BiteBolt-redis-prod
    restart: always
    ports:
      # Không nên expose port Redis ra ngoài Internet
      - "127.0.0.1:6379:6379"
    networks:
      - BiteBolt-network-prod

  kafka:
    image: apache/kafka:3.9.0
    container_name: BiteBolt-kafka-prod
    restart: always
    ports:
      # Expose Kafka ra local để test, trên prod thực tế nên tắt đi
      - "127.0.0.1:9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - BiteBolt-network-prod

  # Ghi chú: redis-ui và kafka-ui đã bị loại bỏ ở môi trường PROD để bảo mật

  # Observability Stack
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: BiteBolt-opensearch-prod
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:-StrongP@ssw0rd123}
    ports:
      - "127.0.0.1:9200:9200"
    networks:
      - BiteBolt-network-prod
    restart: always

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.0
    container_name: BiteBolt-opensearch-dashboards-prod
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      - OPENSEARCH_HOSTS=https://opensearch:9200
    depends_on:
      - opensearch
    networks:
      - BiteBolt-network-prod
    restart: always

  fluent-bit:
    image: fluent/fluent-bit:3.0
    container_name: BiteBolt-fluent-bit-prod
    networks:
      - BiteBolt-network-prod
    depends_on:
      - opensearch
    restart: always

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: BiteBolt-prometheus-prod
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - BiteBolt-network-prod
    restart: always

  grafana:
    image: grafana/grafana:10.4.0
    container_name: BiteBolt-grafana-prod
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - BiteBolt-network-prod
    restart: always

  tempo:
    image: grafana/tempo:2.4.0
    container_name: BiteBolt-tempo-prod
    command: [ "-config.file=/etc/tempo.yaml" ]
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4317:4317" # OTLP gRPC
    networks:
      - BiteBolt-network-prod
    restart: always

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: BiteBolt-alertmanager-prod
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - BiteBolt-network-prod
    restart: always
networks:
  BiteBolt-network-prod:
    driver: bridge

volumes:
  postgres_data_prod:
