server.port=8888

spring.application.name=config-server

#==============================
# Eureka
#==============================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

#==============================
# Config Server (Native Profile)
#==============================
# Kích hoạt chế độ native (đọc file local)
spring.profiles.active=native
spring.profiles.include=native

# Đường dẫn thư mục chứa cấu hình
spring.cloud.config.server.native.search-locations=classpath:/config/

#==============================
# Actuator
#==============================
management.endpoints.web.exposure.include=*
spring.config.import=optional:file:../../.env[.properties],optional:file:.env[.properties],optional:file:../../.env.dev[.properties],optional:file:.env.dev[.properties]