server.port=8888

spring.application.name=config-server

#==============================
# Eureka
#==============================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

#==============================
# Config Server (Native Profile)
#==============================
# Kích hoạt chế độ native (đọc file local)
spring.profiles.active=native
spring.profiles.include=native

# Đường dẫn thư mục chứa cấu hình
spring.cloud.config.server.native.search-locations=classpath:/config/

# CRITICAL: Disable server-side placeholder resolution.
# When true, the config server ships raw ${VAR} strings to clients.
# Each microservice then resolves ${VAR} against its own local environment
# (injected by EnvLoaderEnvironmentPostProcessor from .env.dev).
spring.cloud.config.server.overrideNone=true

#==============================
# Actuator
#==============================
management.endpoints.web.exposure.include=*
spring.config.import=optional:file:../../.env[.properties],optional:file:.env[.properties],optional:file:bitebolt-be/.env[.properties],optional:file:../../.env.dev[.properties],optional:file:.env.dev[.properties],optional:file:bitebolt-be/.env.dev[.properties]