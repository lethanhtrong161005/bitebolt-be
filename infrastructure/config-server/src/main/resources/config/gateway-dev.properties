#=========================================
# Cấu hình riêng cho môi trường DEV
#=========================================

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Redis (Local)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT Secret (Đọc từ .env.dev hoặc biến môi trường)
jwt.secret=${JWT_SECRET}

# Actuator (Mở toàn bộ endpoint để dễ debug)
management.endpoints.web.exposure.include=*

# Swagger UI (Bật trên DEV)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# CORS Configuration (Cho phép localhost Frontend)
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:3000,http://localhost:5173,http://localhost:4200
