#=========================================
# Cấu hình riêng cho môi trường DEV
#=========================================

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Redis (Local)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT Secret (Hardcoded for Dev)
jwt.secret=9a4f2c8d3b7a1e5f8c6b4d2e0a1b3c5e7f9a8b6c4d2e0f1a3c5b7d9e8f0a2b4c

# Actuator (Mở toàn bộ endpoint để dễ debug)
management.endpoints.web.exposure.include=*

# Swagger UI (Bật trên DEV)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# CORS Configuration (Cho phép localhost Frontend)
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:3000,http://localhost:5173,http://localhost:4200
