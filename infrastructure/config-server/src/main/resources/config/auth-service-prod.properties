#=========================================
# Cấu hình riêng cho môi trường PROD
#=========================================

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://discovery-server:8761/eureka/}

# Database (Production)
spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://postgres-server:5432/auth_db}
spring.datasource.username=${AUTH_DB_USERNAME:postgres}
spring.datasource.password=${AUTH_DB_PASSWORD:rootpassword}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Redis (Production)
spring.data.redis.host=${REDIS_HOST:redis-server}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Kafka (Production)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

# JWT Secret (Bắt buộc dùng biến môi trường)
jwt.secret=${JWT_SECRET}

# gRPC Client (Gọi qua DNS của Docker hoặc K8s)
grpc.client.user-service.address=${USER_SERVICE_GRPC_ADDRESS:static://user-service:9091}
grpc.client.user-service.negotiationType=PLAINTEXT

# Cookie Settings (Production HTTPS)
cookie.domain=${COOKIE_DOMAIN:bitebolt.com}
cookie.secure=true
cookie.same-site=None

# CORS Settings
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://admin.bitebolt.com,https://bitebolt.com}
cors.allow-credentials=true

# Microsoft Entra SSO (Ghi đè cho Prod)
entra.success-redirect-url=${ENTRA_SUCCESS_REDIRECT_URL:https://admin.bitebolt.com/dashboard}
