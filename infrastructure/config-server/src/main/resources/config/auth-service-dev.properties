#=========================================
# Cấu hình riêng cho môi trường DEV
#=========================================

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Database (Local Postgres)
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
spring.datasource.username=postgres
spring.datasource.password=rootpassword
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis (Local)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka (Local)
spring.kafka.bootstrap-servers=localhost:9092

# JWT Secret (Hardcoded for Dev)
jwt.secret=9a4f2c8d3b7a1e5f8c6b4d2e0a1b3c5e7f9a8b6c4d2e0f1a3c5b7d9e8f0a2b4c

# gRPC Client
grpc.client.user-service.address=static://localhost:9091
grpc.client.user-service.negotiationType=PLAINTEXT

# Cookie Settings (Cho Localhost)
cookie.domain=localhost
cookie.secure=false
cookie.same-site=Lax

# CORS Settings
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:4200
cors.allow-credentials=true

# Microsoft Entra SSO (Ghi đè cho Local)
entra.success-redirect-url=http://localhost:4200/dashboard

