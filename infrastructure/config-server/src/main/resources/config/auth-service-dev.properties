#=========================================
# Cấu hình riêng cho môi trường DEV
#=========================================

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Database (Local Postgres)
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
spring.datasource.username=postgres
spring.datasource.password=rootpassword
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis (Local)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka (Local)
spring.kafka.bootstrap-servers=localhost:9092

# JWT Secret (Đọc từ .env.dev hoặc biến môi trường)
jwt.secret=${JWT_SECRET}

# gRPC Client
grpc.client.user-service.address=static://localhost:9091
grpc.client.user-service.negotiationType=PLAINTEXT

# Cookie Settings (Cho Localhost)
cookie.domain=localhost
cookie.secure=false
cookie.same-site=Lax

# CORS Settings
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:4200
cors.allow-credentials=true

# Microsoft Entra SSO (DEV - Resolved from .env.dev by EnvLoaderEnvironmentPostProcessor)
# These ${VAR} placeholders are resolved CLIENT-SIDE by auth-service, not by config-server.
# The EnvLoaderEnvironmentPostProcessor injects .env.dev into the top of Spring's PropertySources.
entra.tenant-id=${ENTRA_TENANT_ID}
entra.authority-url=https://login.microsoftonline.com/${ENTRA_TENANT_ID}
entra.authorize-url=https://login.microsoftonline.com/${ENTRA_TENANT_ID}/oauth2/v2.0/authorize
entra.client-id=${ENTRA_CLIENT_ID}
entra.client-secret=${ENTRA_CLIENT_SECRET}
entra.redirect-uri=${ENTRA_REDIRECT_URI}
entra.allowed-email-domain=${ENTRA_ALLOWED_EMAIL_DOMAIN}
entra.success-redirect-url=${ENTRA_SUCCESS_REDIRECT_URL}

