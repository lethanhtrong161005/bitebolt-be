#=========================================
# Cấu hình riêng cho môi trường PROD
#=========================================

# Eureka (Sử dụng hostname trong Docker network hoặc AWS)
eureka.client.service-url.defaultZone=${EUREKA_URL:http://discovery-server:8761/eureka/}

# Redis (Dùng biến môi trường)
spring.data.redis.host=${REDIS_HOST:redis-server}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# JWT Secret (Bắt buộc dùng biến môi trường để bảo mật)
jwt.secret=${JWT_SECRET}

# Actuator (Chỉ mở các endpoint an toàn)
management.endpoints.web.exposure.include=health,info,metrics

# Swagger UI (Tắt trên PROD để bảo mật)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# CORS Configuration (Chỉ cho phép domain thật của hệ thống)
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=${CORS_ALLOWED_ORIGINS:https://admin.bitebolt.com,https://bitebolt.com}
