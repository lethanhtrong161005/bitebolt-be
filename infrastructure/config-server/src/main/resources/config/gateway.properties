server.port=8080

spring.application.name=gateway

# =========================================
# Common Configurations
# =========================================

# Discovery Locator
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# (Eureka, Redis, JWT, Actuator properties moved to gateway-dev.properties & gateway-prod.properties)

# User Service
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/users/**
spring.cloud.gateway.routes[0].filters[0].name=Auth

# Route cho auth-service
spring.cloud.gateway.routes[1].id=auth-service
spring.cloud.gateway.routes[1].uri=lb://auth-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/auth/**
spring.cloud.gateway.routes[1].filters[0].name=Auth

# =========================================
# Swagger UI Aggregator (Common Base)
# =========================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config

springdoc.api-docs.groups.enabled=true
springdoc.swagger-ui.urls[0].url=/v3/api-docs/user-service
springdoc.swagger-ui.urls[0].name=User Service
springdoc.swagger-ui.urls[1].url=/v3/api-docs/auth-service
springdoc.swagger-ui.urls[1].name=Auth Service

# Swagger Routing
spring.cloud.gateway.routes[2].id=user-service-docs
spring.cloud.gateway.routes[2].uri=lb://user-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/v3/api-docs/user-service
spring.cloud.gateway.routes[2].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.routes[3].id=auth-service-docs
spring.cloud.gateway.routes[3].uri=lb://auth-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/v3/api-docs/auth-service
spring.cloud.gateway.routes[3].filters[0]=SetPath=/v3/api-docs

# Global CORS Configuration for Gateway (Common Methods/Headers)
# Note: allowedOrigins is configured in dev/prod properties

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposedHeaders=Set-Cookie,X-Trace-Id
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

# Deduplicate CORS headers to avoid duplicate header errors in browser
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_LAST

