# =========================================
# Common Configurations (Auth Service)
# =========================================
server.port=8082
spring.application.name=auth-service
eureka.instance.prefer-ip-address=true

# Kafka Serializers
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# JWT Expiration (Common)
jwt.access-token-expiration=900
jwt.refresh-token-expiration=604800

# Swagger & Proxy (Common)
springdoc.swagger-ui.enabled=false
server.forward-headers-strategy=framework

# Cookie Max Age (Common)
cookie.access-token-max-age=900
cookie.refresh-token-max-age=604800

# (Other environment-specific properties like Database, Redis, Kafka Brokers, 
# gRPC Clients, CORS, Cookie security flags, and Microsoft Entra SSO credentials
# are managed in auth-service-dev.properties and auth-service-prod.properties)
# SSO credentials are loaded from .env.dev via EnvLoaderEnvironmentPostProcessor,
# not distributed through Config Server to avoid server-side variable resolution issues.

