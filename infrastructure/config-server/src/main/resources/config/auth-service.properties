# =========================================
# Common Configurations (Auth Service)
# =========================================
server.port=8082
spring.application.name=auth-service
eureka.instance.prefer-ip-address=true

# Kafka Serializers
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# JWT Expiration (Common)
jwt.access-token-expiration=900
jwt.refresh-token-expiration=604800

# Swagger & Proxy (Common)
springdoc.swagger-ui.enabled=false
server.forward-headers-strategy=framework

# Cookie Max Age (Common)
cookie.access-token-max-age=900
cookie.refresh-token-max-age=604800

# Microsoft Entra ID SSO Config (Common Core)
entra.authority-url=${ENTRA_AUTHORITY_URL:https://login.microsoftonline.com/${ENTRA_TENANT_ID:common}}
entra.authorize-url=${entra.authority-url}/oauth2/v2.0/authorize
entra.client-id=${ENTRA_CLIENT_ID:}
entra.client-secret=${ENTRA_CLIENT_SECRET:}
entra.redirect-uri=${ENTRA_REDIRECT_URI:}
entra.allowed-email-domain=${ENTRA_ALLOWED_EMAIL_DOMAIN:BiteBolt.com}

# (Other environment-specific properties like Database, Redis, Kafka Brokers, 
# gRPC Clients, CORS, and Cookie security flags are moved to 
# auth-service-dev.properties and auth-service-prod.properties)
