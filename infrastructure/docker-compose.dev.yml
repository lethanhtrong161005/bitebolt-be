version: "3.9"

services:

  postgres:
    image: postgres:15-alpine
    container_name: BiteBolt-postgres
    env_file:
      - ../.env.dev
    environment:
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-rootpassword}
      POSTGRES_DB: user_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - BiteBolt-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: BiteBolt-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    networks:
      - BiteBolt-network

  redis-ui:
    image: redis/redisinsight:latest
    container_name: BiteBolt-redis-ui
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      - redis
    networks:
      - BiteBolt-network

  kafka:
    image: apache/kafka:3.9.0
    container_name: BiteBolt-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"
      - "29092:29092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    networks:
      - BiteBolt-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: BiteBolt-kafka-ui
    restart: unless-stopped

    ports:
      - "8085:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: bitebolt
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

    depends_on:
      - kafka

    networks:
      - BiteBolt-network

  # Observability Stack
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: BiteBolt-opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:-StrongP@ssw0rd123}
    ports:
      - "9200:9200"
    networks:
      - BiteBolt-network

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.0
    container_name: BiteBolt-opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=https://opensearch:9200
    depends_on:
      - opensearch
    networks:
      - BiteBolt-network

  fluent-bit:
    image: fluent/fluent-bit:3.0
    container_name: BiteBolt-fluent-bit
    env_file:
      - ../.env.dev
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
    ports:
      - "24224:24224"
    networks:
      - BiteBolt-network
    depends_on:
      - opensearch

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: BiteBolt-prometheus
    ports:
      - "9090:9090"
    networks:
      - BiteBolt-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: BiteBolt-grafana
    ports:
      - "3001:3000"
    networks:
      - BiteBolt-network

  tempo:
    image: grafana/tempo:2.4.0
    container_name: BiteBolt-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200"
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    networks:
      - BiteBolt-network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: BiteBolt-alertmanager
    ports:
      - "9093:9093"
    networks:
      - BiteBolt-network

networks:
  BiteBolt-network:
    driver: bridge

volumes:
  postgres_data:
